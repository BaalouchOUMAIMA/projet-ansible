
- name: Installation du serveur Web Nginx
  hosts: web-server
  become: yes

  tasks:
    - name: Installer Nginx
      apt:
        name: nginx
        state: present
        update_cache: yes

    - name: Demarrer Nginx
      service:
        name: nginx
        state: started
        enabled: yes

    - name: Verifier que Nginx fonctionne
      uri:
        url: http://localhost
        status_code: 200
